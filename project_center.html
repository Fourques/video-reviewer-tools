<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VideoReviewer · 项目中心</title><link rel="stylesheet" href="/assets/workbench.css"><script src="/assets/app.js" defer></script><style>
.center{width:min(900px,calc(100% - 40px));margin:44px auto}.center-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.center-header h1{font-size:27px}.center-header p{color:var(--muted);margin-top:7px}.center-card{padding:22px;border:1px solid var(--line);border-radius:12px;background:#191f29;margin:15px 0}.center-card h2{font-size:16px;margin-bottom:12px}.center-card input,.center-card select{width:100%}.center-card .path-field{margin:10px 0}.templates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.template{padding:14px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.template:has(input:checked){border-color:#8fb5e6;background:#253448}.template input{width:auto;margin-right:5px}.template p{margin-top:6px;color:var(--muted);font-size:12px}.center-actions{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:22px}#scanPanel{padding:30px}#scanPanel progress{height:13px;margin:20px 0}#scanPanel p{margin:12px 0;color:var(--muted)}.scan-count{float:right;color:#9dbdeb}.folder-dialog .dialog-body{max-height:70vh}#start{padding:10px 30px}.import-row{margin-top:12px}body.scanning .center-card:not(#scanPanel),body.scanning .center-actions{display:none}@media(max-width:650px){.center{margin:24px auto}.templates{grid-template-columns:1fr}.center-header h1{font-size:22px}}
</style></head><body><main class="center"><div class="center-header"><div><h1>视频标注，专注判断。</h1><p>一个项目，一套规则。整段分类与区间选择使用同一工作台。</p></div><span class="badge">VideoReviewer 2.0</span></div><section class="center-card"><h2>选择项目目录</h2><select id="recent" aria-label="最近项目"><option value="">最近使用的项目…</option></select><div class="path-field"><input id="source" placeholder="粘贴视频目录路径"><button id="browse">浏览目录</button></div><p class="hint">只扫描当前目录。已有项目自动恢复规则和进度；旧版进度自动迁入且保留原文件。</p><p class="hint">目录选择器访问的是运行工具的电脑或服务器。</p></section><section class="center-card"><h2>新项目模板 <span class="muted">已有项目无需重新配置</span></h2><div class="templates"><label class="template"><input type="radio" name="preset" value="fall" checked><strong>快速分类</strong><p>默认跌倒 / 不跌倒 / 护工 Fall，J/K/L 连续审核。</p></label><label class="template"><input type="radio" name="preset" value="clips"><strong>时间区间</strong><p>默认 8 秒，可选多段。与整段标签共用同一个播放器。</p></label><label class="template"><input type="radio" name="preset" value="custom"><strong>通用标注</strong><p>自行定义标签；默认仅保存标注，不移动视频。</p></label></div><div class="row import-row"><label class="file-button">导入同事的规则模板<input id="templateFile" type="file" accept=".json" hidden></label><span id="templateStatus" class="muted"></span></div></section><section class="center-card"><details><summary>输出位置（默认即可，后期可改）</summary><div class="path-field"><input id="outputRoot" placeholder="默认：项目目录/output"><button id="browseOutput">浏览目录</button></div><p class="hint">整段分类按标签分子目录，片段放 clips。旧项目继续使用原有输出位置；只有确认整理后才处理视频文件。</p></details></section><section id="scanPanel" class="center-card" hidden><h2><span id="scanStage">准备项目</span><span id="scanCount" class="scan-count"></span></h2><progress id="scanProgress" max="100"></progress><p id="scanDetail">正在建立视频清单…</p><p id="scanElapsed"></p></section><div class="center-actions"><div id="status" class="muted" role="status">配置和进度跟随项目，视频不会上传互联网。</div><div class="row"><button id="quit">退出</button><button id="start" class="primary">开始标注 →</button></div></div></main><dialog id="folderDialog" class="folder-dialog"><div class="dialog-header"><h2>选择项目目录</h2><button id="closeFolder">关闭</button></div><div class="dialog-body"><div class="path-field"><input id="folderPath"><button id="goFolder">转到</button><button id="parentFolder">上一级</button></div><div id="folderList" class="folder-list"></div><p id="folderError" class="error"></p></div><div class="dialog-footer"><span id="chosenPath" class="muted"></span><button id="chooseFolder" class="primary">选择这个目录</button></div></dialog>
<script>
const $=id=>document.getElementById(id),escapeText=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let config={},folder=null,target='source',projectConfig=null;
async function api(path,body,timeout=0){const controller=new AbortController();const timer=timeout?setTimeout(()=>controller.abort(),timeout):null;try{const response=await fetch(path,{signal:controller.signal,...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw new Error(data.error||'请求失败');return data;}finally{clearTimeout(timer);}}
function applyProject(source){$('source').value=source;const previous=config.projects?.[source]||{};const selected=previous.preset||(previous.mode==='clip'?'clips':'fall');document.querySelector(`input[name=preset][value=${['fall','clips','custom'].includes(selected)?selected:'fall'}]`).checked=true;$('outputRoot').value=previous.output_root||'';}
let folderRequest=0;
async function loadFolder(path){const request=++folderRequest;folder=null;$('chooseFolder').disabled=true;$('parentFolder').disabled=true;$('folderList').textContent='正在读取目录…';$('folderError').textContent='';try{const result=await api('/api/directories?'+new URLSearchParams({path}));if(request!==folderRequest)return;folder=result;$('folderPath').value=folder.path;$('chosenPath').textContent=folder.path;$('parentFolder').disabled=!folder.parent;$('folderList').innerHTML=folder.directories.map(item=>`<button class="folder-entry" data-path="${escapeText(item.path)}">▸ ${escapeText(item.name)}</button>`).join('')||'<p class="hint">这个目录没有子目录</p>';$('chooseFolder').disabled=false;}catch(error){if(request===folderRequest){$('folderList').textContent='';$('folderError').textContent=error.message;}}}
function browse(field){target=field;$('folderDialog').showModal();loadFolder($(field).value||$('source').value||config.home);}
$('browse').onclick=()=>browse('source');$('browseOutput').onclick=()=>browse('outputRoot');$('closeFolder').onclick=()=>$('folderDialog').close();$('goFolder').onclick=()=>loadFolder($('folderPath').value);$('folderPath').onkeydown=e=>{if(e.key==='Enter')loadFolder(e.target.value);};$('parentFolder').onclick=()=>loadFolder(folder.parent);$('folderList').onclick=e=>{const b=e.target.closest('[data-path]');if(b)loadFolder(b.dataset.path);};$('chooseFolder').onclick=()=>{if(!folder)return;if(target==='source')applyProject(folder.path);else $(target).value=folder.path;$('folderDialog').close();};$('recent').onchange=()=>{if($('recent').value)applyProject($('recent').value);};
$('templateFile').onchange=async e=>{try{projectConfig=JSON.parse(await e.target.files[0].text());if(projectConfig.version!==2||!Array.isArray(projectConfig.labels))throw new Error('模板格式不支持');document.querySelector('input[name=preset][value=custom]').checked=true;$('templateStatus').textContent=`已载入 ${projectConfig.labels.length} 个标签；不含视频或审核进度`;}catch(error){projectConfig=null;$('templateStatus').textContent=error.message;}};
$('start').onclick=async()=>{if(!$('source').value.trim()){$('status').textContent='请先选择项目目录';return;}$('start').disabled=true;lastScanStatus=null;lastScanReceived=0;scanCancelled=false;beginScan();try{await api('/api/start',{source:$('source').value.trim(),mode:'project',preset:document.querySelector('input[name=preset]:checked').value,output_root:$('outputRoot').value.trim(),projectConfig});if(!scanCancelled)await waitForProject();}catch(error){stopScan();document.body.classList.remove('scanning');$('scanPanel').hidden=true;$('status').textContent=error.message;$('status').classList.add('error');$('start').disabled=false;}};
let lastScanStatus=null,lastScanReceived=0,scanCancelled=false,scanClock=null;
$('scanPanel').insertAdjacentHTML('beforeend','<p id="scanHint" role="status"></p><div class="row"><button id="skipCsv" hidden>本次跳过 CSV，先审核视频</button><button id="copyScan">复制诊断信息</button><button id="cancelScan">取消并退出</button></div>');
$('skipCsv').onclick=async()=>{try{$('skipCsv').disabled=true;await api('/api/startup-skip-metadata',{},8000);$('scanHint').textContent='已请求跳过 CSV；正在结束当前读取，原配置保留。';}catch(error){$('skipCsv').disabled=false;$('scanHint').textContent=error.message;}};
$('copyScan').onclick=async()=>{const text=JSON.stringify({version:'2.0.9',source:$('source').value,clientTime:new Date().toISOString(),...lastScanStatus},null,2);try{await navigator.clipboard.writeText(text);$('scanHint').textContent='诊断信息已复制，可发给维护人员。';}catch{prompt('复制以下诊断信息',text);}};
$('cancelScan').onclick=()=>$('quit').click();
function stopScan(){clearInterval(scanClock);scanClock=null;}
function beginScan(){
 document.body.classList.add('scanning');$('scanPanel').hidden=false;if(scanClock)return;const began=Date.now();$('scanStage').textContent='准备项目';$('scanDetail').textContent='正在检查目录与访问权限…';$('scanCount').textContent='准备中';$('scanProgress').removeAttribute('value');$('scanElapsed').textContent='已用时 0 秒';$('scanHint').textContent='';$('skipCsv').hidden=true;$('skipCsv').disabled=false;
 scanClock=setInterval(()=>{const since=Math.floor((Date.now()-(lastScanReceived||began))/1000);const elapsed=lastScanStatus?(lastScanStatus.elapsedSeconds||0)+since:Math.floor((Date.now()-began)/1000);const idle=(lastScanStatus?.idleSeconds||0)+since;$('scanElapsed').textContent=`已用时 ${elapsed} 秒 · 本阶段 ${(lastScanStatus?.stageSeconds||0)+since} 秒 · 距上次进展 ${idle} 秒`;if(idle>=20)$('scanHint').textContent=lastScanStatus?.canSkipMetadata?'CSV 较大或网络盘响应较慢。可本次跳过 CSV，进入后再手动选择。':'当前阶段较久；可能在等待网络盘或磁盘刷新，可复制诊断信息。';},1000);
}
async function waitForProject(){
 beginScan();
 try{while(!scanCancelled){let data;try{data=await api('/api/startup-status',undefined,8000);}catch{if(scanCancelled)return;$('scanHint').textContent='服务暂未回应，正在重试；计时仍继续，可取消并退出。';await new Promise(resolve=>setTimeout(resolve,1000));continue;}if(scanCancelled)return;lastScanStatus=data;lastScanReceived=Date.now();$('scanStage').textContent=data.stage;$('scanDetail').textContent=data.message;$('skipCsv').hidden=!data.canSkipMetadata;if(data.total>0){$('scanProgress').value=100*data.done/data.total;$('scanCount').textContent=['读取项目快照','恢复操作日志'].includes(data.stage)?`${(data.done/1048576).toFixed(1)} / ${(data.total/1048576).toFixed(1)} MB`:`${data.done}/${data.total}`;}else{$('scanProgress').removeAttribute('value');$('scanCount').textContent=data.done?`${data.stage.includes('CSV')||data.stage==='读取原始标签'?'已读行数':'已处理'} ${data.done}`:'准备中';}if(data.status==='ready'){location.replace('/?project_started='+Date.now());return;}if(data.status==='error')throw new Error(data.message);await new Promise(resolve=>setTimeout(resolve,350));}}finally{stopScan();}
}
$('quit').onclick=async()=>{scanCancelled=true;stopScan();try{await api('/api/quit',{},8000);document.body.classList.remove('scanning');$('scanPanel').hidden=true;$('status').textContent='工具已退出，端口已释放';}catch(error){$('scanHint').textContent=error.message;}};
(async()=>{config=await api('/api/config');$('recent').innerHTML='<option value="">最近使用的项目…</option>'+(config.recentProjects||[]).map(path=>`<option value="${escapeText(path)}">${escapeText(path)}</option>`).join('');if(config.recentProjects?.[0])applyProject(config.recentProjects[0]);const status=await api('/api/startup-status');if(status.status==='scanning'&&!scanClock)await waitForProject();else if(status.status==='ready'&&!scanClock)location.replace('/');})().catch(error=>{stopScan();document.body.classList.remove('scanning');$('scanPanel').hidden=true;$('status').textContent=error.message;});
</script></body></html>
